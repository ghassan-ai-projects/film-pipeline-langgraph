# Base studio profile — inherited by every film project.
# Do not override this file for a single project; create a project override instead.

phases:
  - intake
  - constitution
  - development
  - script
  - visual_dev
  - shot_bible
  - gen_planning
  - generation
  - qc
  - post
  - delivery

review:
  strategy: multi_model_panel
  min_reviewers: 2
  escalation_on_disagreement: true
  approval_gates:
    - config
    - constitution
    - treatment
    - script
    - visual_bible
    - shot_bible
    - generation_spend
    - generation_batch
    - assembly
    - final_delivery

budget:
  project_cap_usd: 100
  per_phase_cap_usd: 25
  max_auto_approved_cost_usd: 1.0
  human_approval_above_usd: 5.0

# Model policy — override individual profiles in a project/quality profile.
# Provider adapters are selected by the model id prefix; adding an adapter does
# not change these defaults. For example, use `zai/glm-5.3-flash` only by
# explicitly setting that primary in a project profile.
model_profiles:
  creative_writer:
    primary: deepseek/deepseek-chat
    fallback: google/gemini-3-flash-preview
    max_tokens: 8192
    temperature: 0.7
    top_p: 0.95
    frequency_penalty: 0.3
  strict_validator:
    primary: deepseek/deepseek-chat
    fallback: google/gemini-3-flash-preview
    max_tokens: 4096
    temperature: 0.1
  visual_reasoner:
    primary: google/gemini-3-flash-preview
    fallback: deepseek/deepseek-chat
    max_tokens: 4096
    temperature: 0.3
  schema_enforcer:
    primary: deepseek/deepseek-chat
    fallback: google/gemini-3-flash-preview
    max_tokens: 4096
    temperature: 0.0
  cheap_draft:
    primary: google/gemini-3-flash-preview
    fallback: deepseek/deepseek-chat
    max_tokens: 4096
    temperature: 0.8
  operations_triage:
    primary: google/gemini-3-flash-preview
    fallback: deepseek/deepseek-chat
    max_tokens: 4096
    temperature: 0.2
  multimodal_reviewer:
    primary: google/gemini-3-flash-preview
    fallback: deepseek/deepseek-chat
    max_tokens: 4096
    temperature: 0.2
  text_validator:
    primary: deepseek/deepseek-chat
    fallback: google/gemini-3-flash-preview
    max_tokens: 4096
    temperature: 0.1

generation:
  default_mode: test
  duration_seconds: 1
  resolution: 480p
  re_anchor_every_n_clips: 5
  allow_parallel_independent_tests: true
  require_last_frame_chaining: true
  re_anchor_on_scene_boundary: true
  re_anchor_on_drift_warning: true

delivery:
  modes:
    - mp4
  include_subtitles: true
  include_audio_stems: false

# NOTE (Flx-F9 config contract): the former `validation.thresholds` block was
# removed — no code path feeds resolved-config thresholds into the validators
# (see documentation/reviews/hardcoded-values-inventory.md §C re-check). The
# per-entry ValidatorThresholds literals in validation/thresholds.py are the
# authority; wiring profile-configured thresholds is deferred to roadmap C-6.
