quality_profile: festival
review:
  strategy: multi_model_panel
  min_reviewers: 3
  escalation_on_disagreement: true
generation:
  default_mode: production
  resolution: 1080p
  allow_parallel_independent_tests: false

# Model routing overrides — raise the creative agents to a stronger tier for
# festival quality. These flow through ModelRouter.resolve_model_params at run
# time (no code change needed). Set `primary` to your licensed top model id —
# e.g. an OpenRouter id such as anthropic/claude-opus-4, or an explicitly
# configured adapter id such as zai/glm-5.3-flash.
model_profiles:
  creative_writer:
    # primary: <your-strong-model-id>
    max_tokens: 16384
    temperature: 0.75
  strict_validator:
    # primary: <your-strong-model-id>
    max_tokens: 8192
