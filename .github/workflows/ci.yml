name: CI

on:
  # PR checks are the gate. Merges to main are NOT re-run (branch protection
  # already required a passing PR), which avoids paying for redundant work.
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  # Manual trigger for running the full pipeline against main on demand.
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to avoid paying for stale work.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ci:
    name: "Python CI"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install ffmpeg (for mock provider video generation)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install project
        run: uv sync --group dev

      - name: CI check
        run: make ci-verify PYTHON=3.12
