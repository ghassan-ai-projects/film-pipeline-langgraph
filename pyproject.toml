[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "film-pipeline"
version = "0.1.0"
description = "LangGraph-based film creation pipeline — a studio operating system with MCP-first control, many expert agents, human review gates, and typed state."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Ghassan", email = "ghassan@example.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "langgraph>=0.2,<0.3",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/ghassan-ai-projects/film-pipeline-langgraph"
Repository = "https://github.com/ghassan-ai-projects/film-pipeline-langgraph"
Issues = "https://github.com/ghassan-ai-projects/film-pipeline-langgraph/issues"

[dependency-groups]
dev = [
  "coverage[toml]>=7.8",
  "mypy>=1.18",
  "pre-commit>=4.3",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/film_pipeline"]

[tool.hatch.build.targets.sdist]
include = [
  "src/film_pipeline",
  "tests",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
addopts = [
  "-q",
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "--cov=film_pipeline",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]
xfail_strict = true
markers = [
  "integration: marks tests as integration (slow)",
  "e2e: marks tests as end-to-end (require mock provider harness)",
]

[tool.coverage.run]
branch = true
source = ["film_pipeline"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "PIE", "PTH", "RET", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "S101"]
"src/film_pipeline/providers/**/*.py" = ["S104"]
"src/film_pipeline/mcp/tools/**/*.py" = ["ARG001"]
"src/film_pipeline/mcp/server.py" = ["ARG001"]