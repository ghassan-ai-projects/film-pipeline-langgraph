[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "film-pipeline"
version = "0.4.0"
description = "LangGraph-based film creation pipeline — a studio operating system with MCP-first control, many expert agents, human review gates, and typed state."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Ghassan", email = "ghassan@example.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "langgraph>=0.2,<0.3",
  "pillow>=12.2.0",
  "pydantic>=2.7,<3",
  "pypdf>=6.14.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.0",
]

[project.scripts]
film-pipeline-run = "film_pipeline.cli.run:main"

[project.urls]
Homepage = "https://github.com/ghassan-ai-projects/film-pipeline-langgraph"
Repository = "https://github.com/ghassan-ai-projects/film-pipeline-langgraph"
Issues = "https://github.com/ghassan-ai-projects/film-pipeline-langgraph/issues"

[dependency-groups]
dev = [
  "coverage[toml]>=7.8",
  "langgraph-checkpoint-sqlite>=2.0.11",
  "mypy>=1.18",
  "pre-commit>=4.3",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "pytest-xdist>=3.8.0",
  "ruff>=0.12",
]

[tool.uv]
# Keep the uv cache inside the repository instead of `~/.cache/uv`.
#
# Why: agent sandboxes (and some CI runners) deny writes outside the workspace, and
# a denied cache turns into `error: Failed to initialize cache at
# /Users/<user>/.cache/uv ... Operation not permitted`. That surfaces as a failed
# `uv build` — which only runs in pre-push, so the symptom is "pushing is broken"
# rather than "the cache is misplaced".
#
# Setting it here rather than exporting `UV_CACHE_DIR` fixes every invocation at
# once, including the pre-commit hooks, which run `uv` in their own environment and
# never see a shell export. `.uv-cache/` is already in .gitignore.
cache-dir = ".uv-cache"

[tool.hatch.build.targets.wheel]
packages = ["src/film_pipeline"]
# `devharness` holds test doubles and scenario scripts. Nothing in production
# imports it (measured: zero `src/` importers outside the package), and D6
# makes it dev-only, so it is not shipped.
exclude = ["src/film_pipeline/devharness"]

[tool.hatch.build.targets.sdist]
include = [
  "src/film_pipeline",
  "tests",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
addopts = [
  "-q",
  "-n", "auto",
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "-W", "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
  "--cov=film_pipeline",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
  "--cov-precision=2",
]
testpaths = ["tests"]
xfail_strict = true
markers = [
  "integration: marks tests as integration (slow)",
  "e2e: marks tests as end-to-end (require mock provider harness)",
  "smoke: marks tests as smoke (validate documented operator workflow)",
  "real_provider: marks tests that call live paid providers",
]

[tool.coverage.run]
branch = true
source = ["film_pipeline"]
omit = [
  "*/devharness/*",
  "src/film_pipeline/mcp/tools/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
omit = [
  "*/devharness/*",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["yaml", "langgraph", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = ["scripts/", "langgraph.json"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "PIE", "PTH", "RET", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "S101"]
"src/film_pipeline/providers/**/*.py" = ["S104"]
"src/film_pipeline/mcp/tools/**/*.py" = ["ARG001"]
